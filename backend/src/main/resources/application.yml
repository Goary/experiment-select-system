server:
  port: 8080

spring:
  application:
    name: lab-select
  datasource:
    url: jdbc:mysql://localhost:3306/lab_select?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: lab-select-jwt-secret-key-please-change-in-production-0123456789abcdef
  expire-hours: 12
